[build-system]
requires = ["setuptools>=77", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orthodr"
version = "0.1.0"
description = "Semiparametric dimension reduction with orthogonality constrained optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
authors = [{name = "Ruoqing Zhu"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.6"]

[project.urls]
Documentation = "https://teazrq.github.io/orthoDr-Python/"
Source = "https://github.com/teazrq/orthoDr-Python"
Issues = "https://github.com/teazrq/orthoDr-Python/issues"

[tool.setuptools]
packages = ["orthodr"]
include-package-data = false

[tool.setuptools.package-data]
orthodr = ["data/*.npy", "data/*.json"]
